# Packages to be installed from the AUR
[managers.aur]
items = [
  "iris-colors",
  "bzmenu",
  "iwmenu",
  "pwmenu-git",
  "kora-icon-theme",
  "elephant-all",
  "walker-bin",
  "waypaper",
  "wl-kbptr",
  "wlr-which-key",
  "avizo",
  "sesh-bin",
  "bemoji",
]

# Packages to be installed via Flatpak.
[managers.flatpak]
items = [
  "com.github.tchx84.Flatseal",
  "io.github.kolunmi.Bazaar",
  "it.mijorus.gearlever",
  "io.github.arijanj.Mimic",
  "io.github.flattool.Ignition",
  "org.localsend.localsend_app",
]

# Hyprland plugin repos to be installed via hyprpm.
[managers.hyprpm_repo]
items = [
  "https://github.com/hyprwm/hyprland-plugins",
  "https://github.com/virtcode/hypr-dynamic-cursors",
  "https://github.com/yayuuu/hyprland-scroll-overview"
]
# Hyprland plugins to be enabled via hyprpm.
[managers.hyprpm_plugin]
items = [
  "hyprbars",
  "scrolloverview",
  "dynamic-cursors",
]
