# This is an example Hyprland config file.
#
# Refer to the wiki for more information.

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,preferred,auto,auto


# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf
source = ~/.config/hypr/rose-pine.conf

# Some default env vars.
env = XCURSOR_SIZE,24

env = XDG_CURRENT_DESKTOP,Hyprland

# Execute your favorite apps at launch
# exec-once = waybar & hyprpaper & firefox
exec-once = dbus-update-activation-environment --systemd --all; systemctl --user import-environment QT_QPA_PLATFORMTHEME
#exec-once = ~/.config/hypr/xdph-start.sh
exec-once = ~/.config/hypr/autostart.sh

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = se
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = true
        clickfinger_behavior = true
        middle_button_emulation = true
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 10
    border_size = 2
    # col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    #col.active_border = rgba(00750eee) # rgba(00ff99ee) 45deg
    col.active_border = $rose $pine 90deg
    # col.inactive_border = rgba(595959aa)
    col.inactive_border = $muted

    layout = master
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10
    blur {
      enabled = true
      size = 8
      passes = 1
      new_optimizations = true
    }

    drop_shadow = true
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(1a1a1aee)

    #dim_inactive = true
}

animations {
    enabled = true

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_is_master = true
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe = true
}

misc {
  force_default_wallpaper = 0
  mouse_move_enables_dpms = true
  key_press_enables_dpms = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
device:epic-mouse-v1 {
    sensitivity = -0.5
}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrulev2 = opacity 0.0 override 0.0 override,class:^(xwaylandvideobridge)$
windowrulev2 = noanim,class:^(xwaylandvideobridge)$
windowrulev2 = nofocus,class:^(xwaylandvideobridge)$
windowrulev2 = noinitialfocus,class:^(xwaylandvideobridge)$

windowrulev2 = float, class:^(firefox)$, title:^(Picture-in-Picture)$
windowrulev2 = pin, class:^(firefox)$, title:^(Picture-in-Picture)$
#windowrulev2 = move 100%- 100%-, class:^(firefox)$, title:^(Picture-in-Picture)$


plugin {
  hyprtrails {
    color = $pine
  }
  hyprwinwrap {
    class = kitty-bg
  }
  hyprbars {
    bar_precedence_over_border = true
    bar_part_of_window = true
    col.text = $text
    bar_text_size = 13
    hyprbars-button = icon
    bar_height = 20
  }
}

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod SHIFT, return, exec, kitty
bind = $mainMod SHIFT, C, killactive,
bind = $mainMod CTRL, Q, exec, wlogout
bind = $mainMod, F, exec, dolphin
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, rofi -show run
#bind = ALT, space, exec, rofi -show drun
bind = $mainMod, space, exec, ulauncher-toggle
bind = $mainMod, tab, exec, rofi -show window
#bind = $mainMod, P, pseudo, # dwindle
#bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, B, exec, firefox
bind = $mainMod CTRL, F, fullscreen
bind = $mainMod CTRL, L, exec, swaylock -c 000000

# Move focus with mainMod + [jk]
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u

# Resize windows with [hl]
bind = $mainMod, H, resizeactive, -10 0
bind = $mainMod, L, resizeactive, 10 0

# Move window
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r

# Swap window with master with mainMod + Return
bind = $mainMod, return, layoutmsg, swapwithmaster

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# volume buttons
bind = , XF86AudioRaiseVolume, exec, volumectl -u +
bind = , XF86AudioLowerVolume, exec, volumectl -u -
bind = , XF86AudioMute, exec, volumectl %
bind = ALT, XF86AudioRaiseVolume, exec, volumectl -m -u +
bind = ALT, XF86AudioLowerVolume, exec, volumectl -m -u -
bind = ALT, XF86AudioMute, exec, volumectl -m %

# brightness buttons
bind = , XF86MonBrightnessUp, exec, lightctl +
bind = , XF86MonBrightnessDown, exec, lightctl -

# keyboard backlight buttons
bind = , XF86KbdBrightnessUp, exec, lightctl -D smc::kbd_backlight +
bind = , XF86KbdBrightnessDown, exec, lightctl -D smc::kbd_backlight -

# media buttons
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = ALT, mouse:272, movewindow
bindm = SUPER, mouse:272, resizewindow

#bind = , XF86LaunchA, hycov:toggleoverview
