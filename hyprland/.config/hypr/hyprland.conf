monitor=,preferred,auto,auto

source = rose-pine.conf
source = monitors.conf
source = workspaces.conf
source = colors.conf

exec-once = hyprctl setcursor Bibata-Modern-Classic 24
env = HYPRCURSOR_THEME,HyprBibataModernClassicSVG

env = XDG_CURRENT_DESKTOP,Hyprland

env = GDK_SCALE,2

exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment QT_QPA_PLATFORMTHEME

exec-once = ~/.config/hypr/scripts/autostart.sh

input {
    kb_layout = us,se
    kb_variant = altgr-weur,

    numlock_by_default = true

    touchpad {
        natural_scroll = true
        disable_while_typing = false
    }
}

general {
    gaps_out = 10

    border_size = 2
    col.active_border = $primary
    col.inactive_border = $outline

    layout = scrolling

    allow_tearing = true

    snap {
      enabled = true
    }
}

decoration {
    blur {
      enabled = false
    }

}

animations {
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, myBezier, popin 80%
    animation = border, 0
    animation = borderangle, 0
    animation = workspaces, 1, 2, default, fade
}

master {
    new_status = inherit
}

misc {
  font_family = Adwaita Sans

  force_default_wallpaper = 0
  mouse_move_enables_dpms = true
  key_press_enables_dpms = true

  enable_swallow = true
  swallow_regex = ^(kitty|org.wezfurlong.wezterm|com.mitchellh.ghostty)$
  swallow_exception_regex = ^(wev)$

  focus_on_activate = true
}

group {
  insert_after_current = false

  col.border_active = $primary
  col.border_inactive = $outline

  col.border_locked_active = $error
  col.border_locked_inactive = $outline

  groupbar {
    font_size = 13
    text_color = $on_primary
    height = 20

    col.active = $primary
    col.inactive = $outline

    col.locked_active = $error
    col.locked_inactive = $outline
  }
}

xwayland {
  force_zero_scaling = true
}

ecosystem {
  enforce_permissions = true
}


windowrule {
  name = xwayland-video-bridge-fixes
  match:class = xwaylandvideobridge

  no_initial_focus = true
  no_focus = true
  no_anim = true
  no_blur = true
  max_size = 1 1
  opacity = 0.0
}

windowrule {
  name = picture-in-picture
  match:title = ^(Picture[- ]in[- ][Pp]icture)$

  float = true
  pin = true
}

windowrule = match:class ^(ulauncher)$,border_size 0


# Permissions
permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
permission = /usr/bin/hyprlock, screencopy, allow
permission = /usr/bin/wl-kbptr, screencopy, allow


plugin {
  hyprtrails {
    color = $primary
  }
  hyprwinwrap {
    class = kitty-bg
  }
  hyprbars {
    bar_precedence_over_border = true
    bar_part_of_window = true
    col.text = $text
    bar_text_size = 13
    bar_height = 20
  }
  hy3 {
    tab_first_window = true
    tabs {
      height = 18
      padding = 0
      radius = 0

      col.active = $primary
      col.active.border = $primary
      col.active.text = $on_primary

      col.inactive = $outline
      col.inactive.border = $outline

      col.active_alt_monitor = $source_color
      col.active_alt_monitor.border = $source_color

      col.focused = $source_color
      col.focused.border = $source_color

      text_font = Adwaita Sans
      text_height = 11
    }
  }
  dynamic-cursors {
    mode = rotate

    rotate {
      length = 24
    }
  }
}

$mainMod = SUPER

# Application launch keybinds
bind = $mainMod, return, exec, uwsm app -- ghostty
bind = $mainMod, F, exec, uwsm app -- nautilus
bind = $mainMod, B, exec, uwsm app -- zen-browser
bind = $mainMod, V, exec, clipman pick --tool=rofi
bind = $mainMod, S, exec, wlr-which-key -k s
bind = , PRINT, exec, uwsm app -- flameshot gui

# Launcher keybinds
bind = $mainMod, D, exec, rofi -show combi
bind = $mainMod, R, exec, walker
bind = $mainMod, tab, exec, rofi -show window

# Window mainpulation keybinds
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, space, togglefloating,
bind = $mainMod SHIFT, F, fullscreen
bind = $mainMod, P, pin

# Compositor keybinds
bind = $mainMod CTRL, Q, exec, uwsm stop
bind = $mainMod CTRL, L, exec, loginctl lock-session

# Move focus with mainMod + [hjkl]
bind = $mainMod, H, layoutmsg, focus l
bind = $mainMod, J, layoutmsg, focus d
bind = $mainMod, K, layoutmsg, focus u
bind = $mainMod, L, layoutmsg, focus r

# Switch focused monitor with mainMod + [ or mainMod + ]
bind = $mainMod, bracketright, focusmonitor, +1
bind = $mainMod, bracketleft, focusmonitor, -1

bind = $mainMod, space, exec, hyprctl dispatch focuswindow $(if [[ $(hyprctl activewindow -j | jq ."floating") == "true" ]]; then echo "tiled"; else echo "floating"; fi;)

# Move window
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

bind = $mainMod, period, layoutmsg, promote
bind = $mainMod, comma, layoutmsg, togglefit

# Move column
bind = $mainMod SHIFT, bracketleft, layoutmsg, swapcol l
bind = $mainMod SHIFT, bracketright, layoutmsg, swapcol r

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1, follow
bind = $mainMod SHIFT, 2, movetoworkspace, 2, follow
bind = $mainMod SHIFT, 3, movetoworkspace, 3, follow
bind = $mainMod SHIFT, 4, movetoworkspace, 4, follow
bind = $mainMod SHIFT, 5, movetoworkspace, 5, follow
bind = $mainMod SHIFT, 6, movetoworkspace, 6, follow
bind = $mainMod SHIFT, 7, movetoworkspace, 7, follow
bind = $mainMod SHIFT, 8, movetoworkspace, 8, follow
bind = $mainMod SHIFT, 9, movetoworkspace, 9, follow
bind = $mainMod SHIFT, 0, movetoworkspace, 10, follow

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# volume buttons
bind = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bind = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bind = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bind = ALT, XF86AudioRaiseVolume, exec, swayosd-client --input-volume raise
bind = ALT, XF86AudioLowerVolume, exec, swayosd-client --input-volume lower
bind = ALT, XF86AudioMute, exec, swayosd-client --input-volume mute-toggle

# brightness buttons
bind = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bind = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# keyboard backlight buttons
bind = , XF86KbdBrightnessUp, exec, lightctl -D smc::kbd_backlight +
bind = , XF86KbdBrightnessDown, exec, lightctl -D smc::kbd_backlight -

# media buttons
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, F, layoutmsg, colresize 1.0
bind = $mainMod, Equal, layoutmsg, colresize +conf
bind = $mainMod, Minus, layoutmsg, colresize -conf


# resize/movewindow submap start #
bind = $mainMod SHIFT, R, submap, resize
submap = resize

bind = , H, resizeactive, -10 0
bind = , J, resizeactive, 0 10
bind = , K, resizeactive, 0 -10
bind = , L, resizeactive, 10 0

bind = SHIFT, H, movewindow, l
bind = SHIFT, J, movewindow, d
bind = SHIFT, K, movewindow, u
bind = SHIFT, L, movewindow, r

bind = , escape, submap, reset
submap = reset
# resize/movewindow submap end #

bind = $mainMod CTRL SHIFT, L, submap, lock
submap = lock
bind = $mainMod CTRL SHIFT, escape, submap, reset
submap = reset

bind = $mainMod, C, exec, wlr-which-key -k c

# hyprlang noerror true
bind = $mainMod, W, overview:toggle, toggle
# hyprlang noerror false

# hyprkool start #
# Basic movement between and within activities
bind = $mainMod ALT, bracketright, exec, hyprkool next-activity -c
bind = $mainMod ALT, bracketleft, exec, hyprkool prev-activity -c
bind = $mainMod ALT SHIFT, bracketright, exec, hyprkool next-activity -c -w
bind = $mainMod ALT SHIFT, bracketleft, exec, hyprkool prev-activity -c -w
bind = $mainMod ALT, h, exec, hyprkool move-left -c
bind = $mainMod ALT, l, exec, hyprkool move-right -c
bind = $mainMod ALT, j, exec, hyprkool move-down -c
bind = $mainMod ALT, k, exec, hyprkool move-up -c
bind = $mainMod ALT SHIFT, h, exec, hyprkool move-left -cw
bind = $mainMod ALT SHIFT, l, exec, hyprkool move-right -cw
bind = $mainMod ALT SHIFT, j, exec, hyprkool move-down -cw
bind = $mainMod ALT SHIFT, k, exec, hyprkool move-up -cw

# Easy switching/moving windows between activities
bind = $mainMod ALT, 1, exec, hyprkool switch-to-activity -n A1
bind = $mainMod ALT, 2, exec, hyprkool switch-to-activity -n A2
bind = $mainMod ALT, 3, exec, hyprkool switch-to-activity -n A3
bind = $mainMod ALT, 4, exec, hyprkool switch-to-activity -n A4
bind = $mainMod ALT, 5, exec, hyprkool switch-to-activity -n A5
bind = $mainMod ALT, 6, exec, hyprkool switch-to-activity -n A6
bind = $mainMod ALT, 7, exec, hyprkool switch-to-activity -n A7
bind = $mainMod ALT, 8, exec, hyprkool switch-to-activity -n A8
bind = $mainMod ALT, 9, exec, hyprkool switch-to-activity -n A9
bind = $mainMod ALT SHIFT, 1, exec, hyprkool switch-to-activity -wn A1
bind = $mainMod ALT SHIFT, 2, exec, hyprkool switch-to-activity -wn A2
bind = $mainMod ALT SHIFT, 3, exec, hyprkool switch-to-activity -wn A3
bind = $mainMod ALT SHIFT, 4, exec, hyprkool switch-to-activity -wn A4
bind = $mainMod ALT SHIFT, 5, exec, hyprkool switch-to-activity -wn A5
bind = $mainMod ALT SHIFT, 6, exec, hyprkool switch-to-activity -wn A6
bind = $mainMod ALT SHIFT, 7, exec, hyprkool switch-to-activity -wn A7
bind = $mainMod ALT SHIFT, 8, exec, hyprkool switch-to-activity -wn A8
bind = $mainMod ALT SHIFT, 9, exec, hyprkool switch-to-activity -wn A9
# hyprkool end #

bind = $mainMod CTRL, space, exec, hyprctl switchxkblayout keyd-virtual-keyboard next

# gestures
gesture = 3, left, dispatcher, exec, hyprkool move-right -c
gesture = 3, down, dispatcher, exec, hyprkool move-up -c
gesture = 3, up, dispatcher, exec, hyprkool move-down -c
gesture = 3, right, dispatcher, exec, hyprkool move-left -c

gesture = 4, right, dispatcher, exec, hyprkool prev-activity -c
gesture = 4, left, dispatcher, exec, hyprkool next-activity -c
gesture = 4, up, dispatcher, overview:close
gesture = 4, down, dispatcher, overview:open
# vim: ft=hyprlang
