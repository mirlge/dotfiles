# This is an example Hyprland config file.
#
# Refer to the wiki for more information.

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,highres,auto,2


# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf
source = ~/.config/hypr/rose-pine.conf

# Some default env vars.
env = XCURSOR_SIZE,24
exec-once = hyprctl setcursor Bibata-Modern-Classic 24
env = HYPRCURSOR_THEME,HyprBibataModernClassicSVG

env = XDG_CURRENT_DESKTOP,Hyprland

env = GDK_SCALE,2

# Execute your favorite apps at launch
# exec-once = waybar & hyprpaper & firefox
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment QT_QPA_PLATFORMTHEME
#exec-once = ~/.config/hypr/xdph-start.sh
exec-once = ~/.config/hypr/autostart.sh

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us,se
    kb_variant = altgr-weur,

    numlock_by_default = true

    touchpad {
        natural_scroll = true
        clickfinger_behavior = true
        disable_while_typing = false
    }
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_out = 10

    border_size = 2
    resize_on_border = true
    col.active_border = $pine
    col.inactive_border = $muted

    layout = hy3

    allow_tearing = true
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    blur {
      enabled = false
    }

}

animations {
    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_status = inherit
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe = true
    workspace_swipe_forever = true
}

misc {
  font_family = Inter Variable

  force_default_wallpaper = 0
  mouse_move_enables_dpms = true
  key_press_enables_dpms = true

  enable_swallow = true
  swallow_regex = ^(kitty|org.wezfurlong.wezterm)$
  swallow_exception_regex = ^(wev)$

  focus_on_activate = true
}

group {
  insert_after_current = false

  col.border_active = $pine
  col.border_inactive = $muted

  col.border_locked_active = $love
  col.border_locked_inactive = $muted

  groupbar {
    font_size = 13
    text_color = $text
    height = 20

    col.active = $pine
    col.inactive = $muted

    col.locked_active = $love
    col.locked_inactive = $muted
  }
}

xwayland {
  force_zero_scaling = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
#device {
  #name = epic-mouse-v1
  #sensitivity = -0.5
#}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrulev2 = opacity 0.0 override 0.0 override,class:^(xwaylandvideobridge)$
windowrulev2 = noanim,class:^(xwaylandvideobridge)$
windowrulev2 = noinitialfocus,class:^(xwaylandvideobridge)$
windowrulev2 = nofocus,class:^(xwaylandvideobridge)$
windowrulev2 = maxsize 1 1,class:^(xwaylandvideobridge)$
windowrulev2 = noblur,class:^(xwaylandvideobridge)$
windowrulev2 = pin,class:^(xwaylandvideobridge)$

windowrulev2 = float, class:^(firefox)$, title:^(Picture-in-Picture)$
windowrulev2 = pin, class:^(firefox)$, title:^(Picture-in-Picture)$

windowrulev2 = noborder,class:^(ulauncher)$


plugin {
  hyprtrails {
    color = $pine
  }
  hyprwinwrap {
    class = kitty-bg
  }
  hyprbars {
    bar_precedence_over_border = true
    bar_part_of_window = true
    col.text = $text
    bar_text_size = 13
    hyprbars-button = icon
    bar_height = 20
  }
  hy3 {
    tab_first_window = true
    tabs {
      height = 18
      padding = 0
      rounding = 0

      col.active = $pine
      col.inactive = $muted

      text_font = Inter Variable
      text_height = 11

      col.text.active = $text
      col.text.inactive = $text
    }
  }
}

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Application launch keybinds
bind = $mainMod, return, exec, wezterm
bind = $mainMod, F, exec, nautilus
bind = $mainMod, B, exec, firefox
bind = $mainMod, C, exec, warpd --normal

# Launcher keybinds
bind = $mainMod, R, exec, rofi -show combi
bind = $mainMod, space, exec, ulauncher-toggle
bind = $mainMod, tab, exec, rofi -show window

# Window mainpulation keybinds
bind = $mainMod, Q, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod SHIFT, F, fullscreen
bind = $mainMod, P, pin

# Compositor keybinds
bind = $mainMod CTRL, Q, exit
bind = $mainMod CTRL, L, exec, loginctl lock-session

# Move focus with mainMod + [jk]
bind = $mainMod, H, hy3:movefocus, l
bind = $mainMod, J, hy3:movefocus, d
bind = $mainMod, K, hy3:movefocus, u
bind = $mainMod, L, hy3:movefocus, r

bindn = , mouse:272, hy3:focustab, mouse

# Move window
bind = $mainMod SHIFT, H, hy3:movewindow, l
bind = $mainMod SHIFT, J, hy3:movewindow, d
bind = $mainMod SHIFT, K, hy3:movewindow, u
bind = $mainMod SHIFT, L, hy3:movewindow, r

# Switch split layout
bind = $mainMod, apostrophe, hy3:makegroup, h
bind = $mainMod, backslash, hy3:makegroup, v
bind = $mainMod, T, hy3:makegroup, tab

# Change split layout for active window
bind = $mainMod SHIFT, apostrophe, hy3:changegroup, h
bind = $mainMod SHIFT, backslash, hy3:changegroup, v
bind = $mainMod SHIFT, T, hy3:changegroup, toggletab

# Change focus (up/down)wards
bind = $mainMod, period, hy3:changefocus, raise
bind = $mainMod, comma, hy3:changefocus, lower

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, hy3:movetoworkspace, 1, follow
bind = $mainMod SHIFT, 2, hy3:movetoworkspace, 2, follow
bind = $mainMod SHIFT, 3, hy3:movetoworkspace, 3, follow
bind = $mainMod SHIFT, 4, hy3:movetoworkspace, 4, follow
bind = $mainMod SHIFT, 5, hy3:movetoworkspace, 5, follow
bind = $mainMod SHIFT, 6, hy3:movetoworkspace, 6, follow
bind = $mainMod SHIFT, 7, hy3:movetoworkspace, 7, follow
bind = $mainMod SHIFT, 8, hy3:movetoworkspace, 8, follow
bind = $mainMod SHIFT, 9, hy3:movetoworkspace, 9, follow
bind = $mainMod SHIFT, 0, hy3:movetoworkspace, 10, follow

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# volume buttons
bind = , XF86AudioRaiseVolume, exec, volumectl -u +
bind = , XF86AudioLowerVolume, exec, volumectl -u -
bind = , XF86AudioMute, exec, volumectl %
bind = ALT, XF86AudioRaiseVolume, exec, volumectl -m -u +
bind = ALT, XF86AudioLowerVolume, exec, volumectl -m -u -
bind = ALT, XF86AudioMute, exec, volumectl -m %

# brightness buttons
bind = , XF86MonBrightnessUp, exec, lightctl +
bind = , XF86MonBrightnessDown, exec, lightctl -

# keyboard backlight buttons
bind = , XF86KbdBrightnessUp, exec, lightctl -D smc::kbd_backlight +
bind = , XF86KbdBrightnessDown, exec, lightctl -D smc::kbd_backlight -

# media buttons
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


# resize/movewindow submap start #
bind = $mainMod SHIFT, R, submap, resize
submap = resize

bind = , H, resizeactive, -10 0
bind = , J, resizeactive, 0 10
bind = , K, resizeactive, 0 -10
bind = , L, resizeactive, 10 0

bind = SHIFT, H, movewindow, l
bind = SHIFT, J, movewindow, d
bind = SHIFT, K, movewindow, u
bind = SHIFT, L, movewindow, r

bind = , escape, submap, reset
submap = reset
# resize/movewindow submap end #


# groups start #
bind = $mainMod, G, submap, groups

submap = groups
bind = , N, changegroupactive, f
bind = , P, changegroupactive, b

bind = , 1, changegroupactive, 1
bind = , 2, changegroupactive, 2
bind = , 3, changegroupactive, 3
bind = , 4, changegroupactive, 4
bind = , 5, changegroupactive, 5
bind = , 6, changegroupactive, 6
bind = , 7, changegroupactive, 7
bind = , 8, changegroupactive, 8
bind = , 9, changegroupactive, 9
bind = , 0, changegroupactive, 10

bind = SHIFT, H, moveintogroup, l
bind = SHIFT, J, moveintogroup, d
bind = SHIFT, K, moveintogroup, u
bind = SHIFT, L, moveintogroup, r

bind = , return, togglegroup
bind = , backspace, moveoutofgroup

bind = SHIFT, N, movegroupwindow, f
bind = SHIFT, P, movegroupwindow, b

bind = , L, lockactivegroup, toggle
bind = CTRL, L, lockgroups, toggle

bind = , escape, submap, reset
submap = reset
# groups end #

bind = $mainMod CTRL SHIFT, L, submap, lock
submap = lock
bind = $mainMod CTRL SHIFT, escape, submap, reset
submap = reset

# hyprlang noerror true
bind = $mainMod, W, hyprexpo:expo, toggle
# hyprlang noerror false

bind = $mainMod SHIFT, space, exec, hyprctl switchxkblayout keyd-virtual-keyboard next
# vim: ft=hyprlang
