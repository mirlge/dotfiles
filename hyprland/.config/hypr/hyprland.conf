# This is an example Hyprland config file.
#
# Refer to the wiki for more information.

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,highres,auto,2


# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf
source = ~/.config/hypr/rose-pine.conf

# Some default env vars.
env = XCURSOR_SIZE,24
exec-once = hyprctl setcursor Bibata-Modern-Classic 24
env = HYPRCURSOR_THEME,HyprBibataModernClassicSVG

env = XDG_CURRENT_DESKTOP,Hyprland

env = GDK_SCALE,2

# Execute your favorite apps at launch
# exec-once = waybar & hyprpaper & firefox
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment QT_QPA_PLATFORMTHEME
#exec-once = ~/.config/hypr/xdph-start.sh
exec-once = ~/.config/hypr/autostart.sh

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us,se
    kb_variant = altgr-weur,


    touchpad {
        natural_scroll = true
        clickfinger_behavior = true
        middle_button_emulation = true
    }
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_out = 10

    border_size = 2
    resize_on_border = true
    col.active_border = $pine
    col.inactive_border = $muted

    layout = master

    allow_tearing = true
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    blur {
      enabled = false
    }

}

animations {
    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_status = master
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe = true
}

misc {
  font_family = Inter Variable

  force_default_wallpaper = 0
  mouse_move_enables_dpms = true
  key_press_enables_dpms = true
  vrr = 1

  enable_swallow = true
  swallow_regex = ^(kitty|org.wezfurlong.wezterm)$

  focus_on_activate = true
}

group {
  insert_after_current = false

  col.border_active = $pine
  col.border_inactive = $muted

  col.border_locked_active = $love
  col.border_locked_inactive = $muted

  groupbar {
    font_size = 13
    text_color = $text
    height = 20

    col.active = $pine
    col.inactive = $muted

    col.locked_active = $love
    col.locked_inactive = $muted
  }
}

xwayland {
  force_zero_scaling = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
#device {
  #name = epic-mouse-v1
  #sensitivity = -0.5
#}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrulev2 = opacity 0.0 override 0.0 override,class:^(xwaylandvideobridge)$
windowrulev2 = noanim,class:^(xwaylandvideobridge)$
windowrulev2 = noinitialfocus,class:^(xwaylandvideobridge)$
windowrulev2 = nofocus,class:^(xwaylandvideobridge)$
windowrulev2 = maxsize 1 1,class:^(xwaylandvideobridge)$
windowrulev2 = noblur,class:^(xwaylandvideobridge)$
windowrulev2 = pin,class:^(xwaylandvideobridge)$

windowrulev2 = float, class:^(firefox)$, title:^(Picture-in-Picture)$
windowrulev2 = pin, class:^(firefox)$, title:^(Picture-in-Picture)$


plugin {
  hyprtrails {
    color = $pine
  }
  hyprwinwrap {
    class = kitty-bg
  }
  hyprbars {
    bar_precedence_over_border = true
    bar_part_of_window = true
    col.text = $text
    bar_text_size = 13
    hyprbars-button = icon
    bar_height = 20
  }
}

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Application launch keybinds
bind = $mainMod, return, exec, wezterm
bind = $mainMod, F, exec, nautilus
bind = $mainMod, B, exec, firefox
bind = $mainMod, C, exec, warpd --normal

# Launcher keybinds
bind = $mainMod, R, exec, rofi -show combi
bind = $mainMod, space, exec, ulauncher-toggle
bind = $mainMod, tab, exec, rofi -show window
bind = $mainMod, period, exec, bemoji

# Window mainpulation keybinds
bind = $mainMod, Q, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod SHIFT, F, fullscreen
bind = $mainMod, P, pin

# Compositor keybinds
bind = $mainMod CTRL, Q, exit
bind = $mainMod CTRL, L, exec, loginctl lock-session

# Move focus with mainMod + [jk]
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u

# Resize windows with [hl]
bind = $mainMod, H, resizeactive, -10 0
bind = $mainMod, L, resizeactive, 10 0

# Move window
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r

# Swap window with master with mainMod + Return
bind = $mainMod SHIFT, return, layoutmsg, swapwithmaster

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# volume buttons
bind = , XF86AudioRaiseVolume, exec, volumectl -u +
bind = , XF86AudioLowerVolume, exec, volumectl -u -
bind = , XF86AudioMute, exec, volumectl %
bind = ALT, XF86AudioRaiseVolume, exec, volumectl -m -u +
bind = ALT, XF86AudioLowerVolume, exec, volumectl -m -u -
bind = ALT, XF86AudioMute, exec, volumectl -m %

# brightness buttons
bind = , XF86MonBrightnessUp, exec, lightctl +
bind = , XF86MonBrightnessDown, exec, lightctl -

# keyboard backlight buttons
bind = , XF86KbdBrightnessUp, exec, lightctl -D smc::kbd_backlight +
bind = , XF86KbdBrightnessDown, exec, lightctl -D smc::kbd_backlight -

# media buttons
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


# groups start #
$groupMod = $mainMod ALT

bind = $groupMod, N, changegroupactive, f
bind = $groupMod, P, changegroupactive, b

bind = $groupMod, 1, changegroupactive, 1
bind = $groupMod, 2, changegroupactive, 2
bind = $groupMod, 3, changegroupactive, 3
bind = $groupMod, 4, changegroupactive, 4
bind = $groupMod, 5, changegroupactive, 5
bind = $groupMod, 6, changegroupactive, 6
bind = $groupMod, 7, changegroupactive, 7
bind = $groupMod, 8, changegroupactive, 8
bind = $groupMod, 9, changegroupactive, 9
bind = $groupMod, 0, changegroupactive, 10

bind = $groupMod SHIFT, H, moveintogroup, l
bind = $groupMod SHIFT, J, moveintogroup, d
bind = $groupMod SHIFT, K, moveintogroup, u
bind = $groupMod SHIFT, L, moveintogroup, r

bind = $groupMod, return, togglegroup
bind = $groupMod, backspace, moveoutofgroup

bind = $groupMod SHIFT, N, movegroupwindow, f
bind = $groupMod SHIFT, P, movegroupwindow, b

bind = $groupMod, L, lockactivegroup, toggle
bind = $groupMod CTRL, L, lockgroups, toggle
# groups end #

bind = $mainMod CTRL SHIFT, L, submap, lock
submap = lock
bind = $mainMod CTRL SHIFT, escape, submap, reset
submap = reset

# hyprlang noerror true
bind = $mainMod, W, hyprexpo:expo, toggle
# hyprlang noerror false

bind = $mainMod SHIFT, space, exec, hyprctl switchxkblayout keyd-virtual-keyboard next
# vim: ft=hyprlang
