source = ~/.config/hypr/rose-pine.conf

background {
  monitor =
  path = screenshot

  blur_passes = 1
  blur_size = 8
}

input-field {
  monitor =
  size = 300, 20
  dots_size = 0.5

  position = 0, -20
  halign = center
  valign = center
}

# User label
label {
  monitor =
  text = Hello there, $USER
  color = $text
  font_family = Cantarell

  position = 0, 10
  halign = center
  valign = center

  shadow_passes = 1
  shadow_color = $base
}

# Time label
label {
  monitor =
  text = $TIME
  color = $text
  font_size = 25
  font_family = Cantarell

  position = 0, 40
  halign = center
  valign = center

  shadow_passes = 1
  shadow_color = $base
}

# Battery label
label {
  monitor =
  text = cmd[update:2000] printf "    "; cat /sys/class/power_supply/BAT0/capacity | tr -d "\n"; printf '%s' '%'
  font_size = 13
  font_family = Cantarell

  position = 0, 875
  halign = left
  valign = left

  shadow_passes = 1
  shadow_color = $base
}
